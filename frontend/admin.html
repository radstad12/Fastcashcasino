<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastCash Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="admin"><h1>FASTCASH ADMIN</h1><div class="login"><input id="u" value="chicano"><input id="p" type="password" placeholder="Heslo"><button onclick="go()">PŘIHLÁSIT</button></div><div id="dash"></div></main><script src="config.js"></script><script>
let auth="";
async function go(){auth="Basic "+btoa($("u").value+":"+$("p").value);refresh()}
async function refresh(){const r=await fetch(API+"/api/admin/transactions",{headers:{Authorization:auth}});if(!r.ok){$("dash").innerHTML="<p>Přihlášení selhalo.</p>";return}const c=await fetch(API+"/api/casino").then(r=>r.json());const t=await r.json();$("dash").innerHTML=`<div class="stats"><div><b>${c.bankroll.toLocaleString("cs-CZ")}</b><small>POOL</small></div><div><b>${c.available.toLocaleString("cs-CZ")}</b><small>DOSTUPNÉ NA VÝHRY</small></div><div><b>${c.reserve.toLocaleString("cs-CZ")}</b><small>REZERVA</small></div></div><div class="adjust"><input id="a" type="number" placeholder="+ / -"><button onclick="adjust()">UPRAVIT POOL</button></div><pre>${JSON.stringify(t,null,2)}</pre>`}
async function adjust(){const r=await fetch(API+"/api/admin/casino/adjust",{method:"POST",headers:{"Content-Type":"application/json",Authorization:auth},body:JSON.stringify({amount:Number($("a").value)})});if(!r.ok)alert((await r.json()).error);refresh()}
const $=id=>document.getElementById(id);
</script></body></html>
