<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA RP Casino</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div>
    <h1>GTA RP CASINO</h1>
    <small>Online slot floor</small>
  </div>
  <div class="player">
    <input id="playerId" value="demo-player" placeholder="Player ID">
    <button onclick="login()">PŘIPOJIT</button>
    <span id="balance">0 tokenů</span>
  </div>
</header>

<main>
  <section id="games" class="grid"></section>
</main>

<div id="modal" class="modal hidden">
  <div class="game-modal">
    <button class="close" onclick="closeGame()">×</button>
    <h2 id="gameName"></h2>
    <div class="machine">
      <div class="reel" id="r0">7</div>
      <div class="reel" id="r1">BAR</div>
      <div class="reel" id="r2">🍒</div>
    </div>
    <div class="controls">
      <label>Sázka <input id="bet" type="number" min="1" value="100"></label>
      <button id="spin" onclick="spin()">TOČIT</button>
    </div>
    <p id="message"></p>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
